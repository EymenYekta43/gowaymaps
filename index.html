<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOWay MAPS - Canlı Navigasyon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="brand-header">
                <h1>GOWay MAPS</h1>
                <p>Canlı Araç & Rota Takip Portalı</p>
            </div>

            <div class="panel-section">
                <div class="panel-title">Sürücü Başvuru Formu</div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Sürücü / Firma Adı *</label>
                        <input type="text" id="name" placeholder="Örn: Ahmet Yılmaz" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta Adresi *</label>
                        <input type="email" id="email" placeholder="ornek@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="plate">Araç Plakası *</label>
                        <input type="text" id="plate" placeholder="Örn: 06 GW 430" required>
                    </div>
                    <div class="form-group">
                        <label for="vehicleType">Araç Tipi</label>
                        <select id="vehicleType">
                            <option value="Kamyon / Tır">Kamyon / Tır</option>
                            <option value="Panelvan">Panelvan</option>
                            <option value="Binek Araç">Binek Araç</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">BAŞVURUYU GÖNDER</button>
                </form>
                <div id="formResponse"></div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Sistem & Takip Bilgisi</div>
                <div class="telemetry-card">
                    <div class="telemetry-row">
                        <span>Bağlantı:</span>
                        <span id="statusBadge" class="status-badge"><span class="status-dot"></span><span id="statusText">Bağlanıyor...</span></span>
                    </div>
                    <div class="telemetry-row">
                        <span>Aktif Araç:</span>
                        <span id="activeDriver" class="telemetry-value">Henüz Seçilmedi</span>
                    </div>
                    <div class="telemetry-row">
                        <span>Anlık Hız:</span>
                        <span id="speedDisplay" class="telemetry-value highlight">0 km/s</span>
                    </div>
                    <div class="telemetry-row">
                        <span>Tahmini Varış:</span>
                        <span id="etaDisplay" class="telemetry-value">--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
