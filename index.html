<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOWay MAPS - Canlı Araç Takip Platformu</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Geocoder (Arama Motoru) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <!-- FontAwesome (İkonlar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Özel CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Üst Bar (Header) -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-location-dot"></i> GOWay MAPS
        </div>
<div class="nav-controls">
    <button id="themeToggleBtn" class="btn-icon" title="Tema Değiştir"><i class="fa-solid fa-moon"></i></button>
    <button id="openLoginBtn" class="btn-primary" style="background-color: #2e7d32;"><i class="fa-solid fa-right-to-bracket"></i> Sürücü Girişi</button>
    <button id="openFormBtn" class="btn-primary"><i class="fa-solid fa-user-plus"></i> Sürücü Kaydı</button>
</div>
    </header>

    <!-- Harita Alanı -->
    <main id="map-container">
        <div id="map"></div>
    </main>

    <!-- Kayıt Modalı (Form) -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span id="closeModalBtn" class="close">&times;</span>
            <h2><i class="fa-solid fa-truck-fast"></i> Sürücü Başvuru Formu</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Ad Soyad / Firma</label>
                    <input type="text" id="name" required placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" required placeholder="Örn: ahmet@example.com">
                </div>
                <div class="form-group">
                    <label for="plate">Araç Plakası</label>
                    <input type="text" id="plate" required placeholder="Örn: 06 GW 1234">
                </div>
                <div class="form-group">
                    <label for="vehicleType">Araç Tipi</label>
                    <select id="vehicleType" required>
                        <option value="Otomobil">Otomobil</option>
                        <option value="Kamyon/Tır">Kamyon / Tır</option>
                        <option value="Motosiklet">Motosiklet</option>
                        <option value="Servis/Minibüs">Servis / Minibüs</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Başvuruyu Gönder</button>
            </form>
        </div>
    </div>

    <!-- Script Bağlantıları -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
